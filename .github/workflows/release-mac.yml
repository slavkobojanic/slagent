name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.0 (defaults to v + package.json version)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-v$(node -p 'require("./package.json").version')}"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Build slagent.app
        env:
          SLAGENT_NO_INSTALL: "1"
          SLAGENT_SIGN_IDENTITY: "-"
        run: pnpm build:mac

      - name: Package
        id: package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          app="dist/mac-arm64/slagent.app"
          [ -d "$app" ] || app="dist/mac/slagent.app"
          zip="slagent-$TAG-mac-arm64.zip"
          # ditto keeps symlinks and code signatures intact; plain zip breaks the Electron frameworks.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: slagent-${{ steps.version.outputs.tag }}-mac-arm64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          else
            flags="--generate-notes --target $GITHUB_SHA"
            [ "$PRERELEASE" = "true" ] && flags="$flags --prerelease"
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" --title "slagent $TAG" $flags
          fi
