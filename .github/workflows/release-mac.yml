name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.0 (defaults to v + package.json version)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-v$(node -p 'require("./package.json").version')}"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Stamp version into package.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The packaged app version and latest-mac.yml must match the tag, otherwise the
          # updater always thinks the installed build is current.
          node -e 'const fs=require("fs");const p=require("./package.json");p.version=process.argv[1].replace(/^v/,"");fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")' "$TAG"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Build slagent.app
        env:
          SLAGENT_NO_INSTALL: "1"
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm build:mac

      - name: Verify signature and notarization
        run: |
          app="dist/mac-arm64/slagent.app"
          [ -d "$app" ] || app="dist/mac/slagent.app"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"
          xcrun stapler validate "$app"

      - name: Package
        id: package
        run: |
          zip="$(ls dist/*-mac.zip | head -n 1)"
          yml="dist/latest-mac.yml"
          [ -f "$zip" ] || { echo "No mac zip produced"; exit 1; }
          [ -f "$yml" ] || { echo "No latest-mac.yml produced"; exit 1; }
          # Hash the bare filename so it can be verified from the download directory.
          (cd "$(dirname "$zip")" && shasum -a 256 "$(basename "$zip")") > "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "yml=$yml" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: slagent-${{ steps.version.outputs.tag }}-mac-arm64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
            ${{ steps.package.outputs.yml }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          YML: ${{ steps.package.outputs.yml }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # latest-mac.yml must be a release asset: electron-updater reads the feed from it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" "$YML" --clobber
          else
            flags="--generate-notes --target $GITHUB_SHA"
            [ "$PRERELEASE" = "true" ] && flags="$flags --prerelease"
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" "$YML" --title "slagent $TAG" $flags
          fi
