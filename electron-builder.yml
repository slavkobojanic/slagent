appId: com.slagent.app
productName: slagent
directories:
  buildResources: build
  output: dist
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!native/**"
  - "!scripts/**"
  - "!resources/**"
  - "!.agents/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # The iOS app's Xcode project and web bundle.
  # The editor server is shipped as an extra resource below, not inside the app archive.
  - "!vendor/**"
  - "!ios/**"
  - "!out/mobile/**"
  - "!{capacitor.config.ts,vite.mobile.config.ts}"
# Copies the editor's VS Code server into the app before it is signed; see the script for why.
afterPack: scripts/after-pack.cjs
extraResources:
  - from: resources/slagent.app
    to: slagent.app
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon-rounded.png
    to: icon-rounded.png
  - from: resources/menubar.png
    to: menubar.png
  - from: resources/menubar@2x.png
    to: menubar@2x.png
# Writes app-update.yml into the bundle and latest-mac.yml next to the zip so the
# in-app updater can read from the GitHub release feed.
publish:
  provider: github
  owner: slavkobojanic
  repo: slagent
# A release must never ship unsigned or unnotarized: fail the build instead of
# silently publishing an app macOS will refuse to launch.
forceCodeSigning: true
mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  # @electron/osx-sign signs every file it walks, not just Mach-O code. The app ships
  # Electron's ~670 .pak resources plus fonts, images and audio, and giving each one a
  # secure timestamp costs a TSA round trip (~0.3s). Skipping data files took signing
  # from ~6.5min to ~45s; the enclosing bundles still seal them, so verification and
  # notarization are unaffected. Code extensions (.node, .dylib, .bin, ...) are not listed.
  signIgnore:
    - "\\.(pak|png|jpe?g|gif|ico|svg|webp|bmp|tiff?|woff2?|ttf|otf|eot|mp3|wav|ogg|m4a|mp4|webm|mov|nib|icns|dat|gz|zip|wasm|so|dll|exe|map|md|txt|html?|css|scss|less|js|mjs|cjs|jsx|ts|tsx|json|xml|yml|yaml|sh|scpt|code-snippets|npmrc|LICENSE|license)$"
  # zip (not just dir) is required for auto-update: electron-builder only emits
  # app-update.yml / latest-mac.yml for zip or dmg targets.
  target:
    - target: dir
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extendInfo:
    NSAccessibilityUsageDescription: slagent uses Accessibility to read and control the apps you ask it to use.
    NSScreenCaptureUsageDescription: slagent captures one window so it can see the app it is using.
    # Lets the slagent command, Finder's Open With and the Dock icon hand folders to
    # the app. Alternate keeps Finder as the default for opening folders.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
# node-pty ships an N-API prebuild that Electron loads as is, so nothing needs
# rebuilding. Its spawn-helper has to sit outside the archive to be executable.
npmRebuild: false
asarUnpack:
  - "**/node-pty/**"
