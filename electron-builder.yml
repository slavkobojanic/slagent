appId: com.slagent.app
productName: slagent
directories:
  buildResources: build
  output: dist
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!native/**"
  - "!scripts/**"
  - "!resources/**"
  - "!.agents/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
extraResources:
  - from: resources/slagent.app
    to: slagent.app
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon-rounded.png
    to: icon-rounded.png
# Writes app-update.yml into the bundle and latest-mac.yml next to the zip so the
# in-app updater can read from the GitHub release feed.
publish:
  provider: github
  owner: slavkobojanic
  repo: slagent
# A release must never ship unsigned or unnotarized: fail the build instead of
# silently publishing an app macOS will refuse to launch.
forceCodeSigning: true
mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  # zip (not just dir) is required for auto-update: electron-builder only emits
  # app-update.yml / latest-mac.yml for zip or dmg targets.
  target:
    - target: dir
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extendInfo:
    NSAccessibilityUsageDescription: slagent uses Accessibility to read and control the apps you ask it to use.
    NSScreenCaptureUsageDescription: slagent captures one window so it can see the app it is using.
    # Lets the slagent command, Finder's Open With and the Dock icon hand folders to
    # the app. Alternate keeps Finder as the default for opening folders.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
# node-pty ships an N-API prebuild that Electron loads as is, so nothing needs
# rebuilding. Its spawn-helper has to sit outside the archive to be executable.
npmRebuild: false
asarUnpack:
  - "**/node-pty/**"
